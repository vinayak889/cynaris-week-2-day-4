
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .container {
      max-width: 550px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #4f46e5;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .task-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      border: none;
      padding: 11px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .add-btn {
      background: #4f46e5;
      color: white;
    }

    .add-btn:hover {
      background: #3730a3;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px;
      margin-bottom: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
    }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .task-actions {
      display: flex;
      gap: 7px;
    }

    .complete-btn {
      background: #16a34a;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .empty-message {
      text-align: center;
      color: #9ca3af;
      padding: 20px;
    }

    .task-count {
      color: #6b7280;
      margin-top: 15px;
      font-size: 0.9rem;
    }

    @media (max-width: 420px) {
      .container {
        padding: 18px;
      }

      .task-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .task-actions {
        align-self: flex-end;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Organize your daily tasks easily.</p>

    <form class="task-form" id="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Enter a new task..."
        aria-label="New task"
        maxlength="150"
        required
      >
      <button type="submit" class="add-btn">Add</button>
    </form>

    <ul class="task-list" id="task-list" aria-label="Tasks"></ul>

    <p class="empty-message" id="empty-message">
      No tasks yet. Add your first task!
    </p>

    <p class="task-count" id="task-count">0 tasks</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
